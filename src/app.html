<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b1f3a" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			document.documentElement.classList.add('js');
			// If enhance.js never runs (blocked, failed, stale), drop .js so drawings render finished.
			setTimeout(function () {
				var h = document.documentElement;
				if (document.querySelector('[data-draw]') && !h.classList.contains('draw-ready')) h.classList.remove('js');
			}, 2500);
			// Back/Forward restores the finished page: drawings and reveals skip their entrance.
			var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
			if (nav && nav.type === 'back_forward') document.documentElement.classList.add('restored');
			// Tag cross-document view transitions with their direction before first render.
			window.addEventListener('pagereveal', function (e) {
				if (!e.viewTransition) return;
				var a = window.navigation && navigation.activation;
				var back = !!(a && a.navigationType === 'traverse' && a.from && a.entry && a.entry.index < a.from.index);
				e.viewTransition.types.add(back ? 'back' : 'forward');
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
