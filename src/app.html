<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b1f3a" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			document.documentElement.classList.add('js');
			// If enhance.js never runs (blocked, failed, stale), drop .js so drawings render finished.
			setTimeout(function () {
				var h = document.documentElement;
				if (document.querySelector('[data-draw]') && !h.classList.contains('draw-ready')) h.classList.remove('js');
			}, 2500);
			// Back/Forward (and returning home from a project) restores the finished page: no entrance replays.
			var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
			// Arriving home from a project page (the "All work" link) is the same return trip.
			var from = document.referrer && new URL(document.referrer);
			var fromWork = from && from.origin === location.origin && from.pathname.indexOf('/work/') === 0 && location.pathname === '/';
			if (nav && (nav.type === 'back_forward' || (nav.type === 'navigate' && fromWork))) document.documentElement.classList.add('restored');
			// Prev/next and "All work" tell the next page which way to move, but only once their own
			// navigation commits (pageswap), so an aborted click can't mis-type a later one.
			var pend = null;
			document.addEventListener('click', function (e) {
				var a = e.target.closest && e.target.closest('[data-vt-dir]');
				pend = !a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey ? null : [a.getAttribute('data-vt-dir'), a.href];
			});
			window.addEventListener('pageswap', function (e) {
				var a = e.activation;
				if (pend && a && a.navigationType === 'push' && a.entry.url === pend[1]) try { sessionStorage.setItem('vt-dir', pend[0]); } catch (_) {}
				pend = null;
			});
			// Tag cross-document view transitions with their direction before first render.
			window.addEventListener('pagereveal', function (e) {
				var dir = null;
				try { dir = sessionStorage.getItem('vt-dir'); sessionStorage.removeItem('vt-dir'); } catch (_) {}
				if (!e.viewTransition) return;
				var a = window.navigation && navigation.activation;
				var back = !!(a && a.navigationType === 'traverse' && a.from && a.entry && a.entry.index < a.from.index);
				e.viewTransition.types.add(dir || (back ? 'back' : 'forward'));
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
