<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no: page zoom must never fight cornerstone's pinch-zoom -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>MRI/CT Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #viewport {
        position: fixed;
        inset: 0;
        background: #000;
        touch-action: none;
      }
    </style>
    <script type="module" crossorigin src="/demo/mri/mobile/assets/index-H2E_IVt4.js"></script>
  </head>
  <body>
    <div id="viewport"></div>
  </body>
</html>
